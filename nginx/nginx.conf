# Nginx Load Balancer Configuration
# Routes traffic between Blue (production) and Canary (gray) instances

events {
    worker_connections 1024;
}

http {
    upstream production_backend {
        server app-blue:5000 weight=90;
        # Canary gets 10% of traffic (adjust weight for gray release)
        server app-canary:5000 weight=10;
    }

    upstream canary_only {
        server app-canary:5000;
    }

    # Main application endpoint
    server {
        listen 80;
        server_name localhost;

        # Health check for load balancer itself
        location = /lb-health {
            return 200 "load-balancer-healthy\n";
            add_header Content-Type text/plain;
        }

        # Main application - routes to production_backend with canary split
        location / {
            proxy_pass http://production_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Track which backend served the request
            add_header X-Served-By $upstream_addr;
        }

        # Canary inspection endpoint (always routes to canary)
        location /canary/ {
            rewrite ^/canary/(.*) /$1 break;
            proxy_pass http://canary_only;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Served-By "canary";
        }

        # Health check endpoints - route to production
        location /health {
            proxy_pass http://production_backend;
            access_log off;
        }

        location /ready {
            proxy_pass http://production_backend;
            access_log off;
        }
    }
}
