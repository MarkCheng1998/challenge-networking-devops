<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco Switch VLAN Configuration Automation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cisco Switch VLAN Configuration Automation</h1>
            <p class="subtitle">Challenge Networking - Mercado Libre</p>
        </header>

        <div class="main-content">
            <!-- Left: Configuration Form -->
            <div class="panel config-panel">
                <h2>Configuration Parameters</h2>

                <!-- Switch Connection Info -->
                <div class="section">
                    <h3>Switch Connection</h3>
                    <div class="form-group">
                        <label for="host">Switch IP Address</label>
                        <input type="text" id="host" value="192.168.1.1" placeholder="e.g., 192.168.1.1">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" value="admin" placeholder="SSH username">
                        </div>
                        <div class="form-group">
                            <label for="port">SSH Port</label>
                            <input type="number" id="port" value="22" placeholder="22">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" value="admin" placeholder="SSH password">
                        </div>
                        <div class="form-group">
                            <label for="enable_password">Enable Password (Optional)</label>
                            <input type="password" id="enable_password" placeholder="Leave blank to use SSH password">
                        </div>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="simulate" checked>
                        <label for="simulate">Simulation Mode (no real switch required)</label>
                    </div>
                </div>

                <!-- Hostname Configuration -->
                <div class="section">
                    <h3>Switch Hostname</h3>
                    <div class="form-group">
                        <label for="hostname">Target Hostname</label>
                        <input type="text" id="hostname" value="{{ default_hostname }}" placeholder="e.g., SWITCH_AUTOMATIZADO">
                    </div>
                </div>

                <!-- VLAN Configuration -->
                <div class="section">
                    <h3>VLAN Configuration</h3>
                    <div id="vlan-list">
                        <!-- VLAN rows will be dynamically generated by JS -->
                    </div>
                    <button type="button" class="btn btn-small btn-add" onclick="addVlanRow()">+ Add VLAN</button>
                </div>

                <!-- Action Buttons -->
                <div class="actions">
                    <button type="button" class="btn btn-primary" onclick="applyConfiguration()">
                        Execute Automated Configuration
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="validateOnly()">
                        Validate Configuration Only
                    </button>
                </div>
            </div>

            <!-- Right: Execution Results -->
            <div class="panel result-panel">
                <h2>Execution Results</h2>
                <div id="result-content" class="result-content">
                    <p class="placeholder">Results will appear here after configuration execution...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // Default VLANs passed from the template
        const DEFAULT_VLANS = {{ default_vlans | tojson }};
        // Initialize the page
        initPage();
    </script>
</body>
</html>
