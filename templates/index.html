<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco交换机VLAN配置自动化</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cisco交换机VLAN配置自动化</h1>
            <p class="subtitle">Challenge Networking - Mercado Libre</p>
        </header>

        <div class="main-content">
            <!-- 左侧：配置表单 -->
            <div class="panel config-panel">
                <h2>配置参数</h2>

                <!-- 交换机连接信息 -->
                <div class="section">
                    <h3>交换机连接</h3>
                    <div class="form-group">
                        <label for="host">交换机IP地址</label>
                        <input type="text" id="host" value="192.168.1.1" placeholder="如: 192.168.1.1">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <input type="text" id="username" value="admin" placeholder="SSH用户名">
                        </div>
                        <div class="form-group">
                            <label for="port">SSH端口</label>
                            <input type="number" id="port" value="22" placeholder="22">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password">密码</label>
                            <input type="password" id="password" value="admin" placeholder="SSH密码">
                        </div>
                        <div class="form-group">
                            <label for="enable_password">Enable密码 (可选)</label>
                            <input type="password" id="enable_password" placeholder="留空则同SSH密码">
                        </div>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="simulate" checked>
                        <label for="simulate">模拟模式（无需真实交换机）</label>
                    </div>
                </div>

                <!-- 主机名配置 -->
                <div class="section">
                    <h3>交换机主机名</h3>
                    <div class="form-group">
                        <label for="hostname">目标主机名</label>
                        <input type="text" id="hostname" value="{{ default_hostname }}" placeholder="如: SWITCH_AUTOMATIZADO">
                    </div>
                </div>

                <!-- VLAN配置 -->
                <div class="section">
                    <h3>VLAN配置</h3>
                    <div id="vlan-list">
                        <!-- VLAN行将通过JS动态生成 -->
                    </div>
                    <button type="button" class="btn btn-small btn-add" onclick="addVlanRow()">+ 添加VLAN</button>
                </div>

                <!-- 操作按钮 -->
                <div class="actions">
                    <button type="button" class="btn btn-primary" onclick="applyConfiguration()">
                        执行自动化配置
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="validateOnly()">
                        仅验证配置
                    </button>
                </div>
            </div>

            <!-- 右侧：执行结果 -->
            <div class="panel result-panel">
                <h2>执行结果</h2>
                <div id="result-content" class="result-content">
                    <p class="placeholder">配置执行后，结果将在此处显示...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        // 从模板传入的默认VLAN
        const DEFAULT_VLANS = {{ default_vlans | tojson }};
        // 初始化页面
        initPage();
    </script>
</body>
</html>
