name: CI - Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Lint & Format Check ──────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 app.py backend/ tests/ --max-line-length=120 --extend-ignore=E501,W503,E203

      - name: Run black --check
        run: black --check --line-length 120 app.py backend/ tests/ scripts/

  # ─── Unit & Integration Tests ─────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=backend \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70 \
            --html=reports/test-report.html \
            --self-contained-html

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            reports/

  # ─── Security Scan ─────────────────────────────────────────────────
  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: bandit -r backend/ scripts/ app.py -ll -x tests -f json -o bandit-report.json || true

      - name: Check for HIGH severity issues
        run: |
          HIGH_COUNT=$(python -c "import json; r=json.load(open('bandit-report.json')); print(len([i for i in r.get('results',[]) if i.get('issue_severity')=='HIGH']))")
          echo "HIGH severity issues: $HIGH_COUNT"
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::Found $HIGH_COUNT HIGH severity security issues"
            cat bandit-report.json | python -m json.tool
            exit 1
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json

  # ─── Build Docker Image ───────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: challenge-networking:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run -d --name test-container -p 5001:5000 challenge-networking:${{ github.sha }}
          sleep 5
          curl -sf http://localhost:5001/health | python -m json.tool
          curl -sf http://localhost:5001/ready | python -m json.tool
          docker stop test-container
          docker rm test-container
