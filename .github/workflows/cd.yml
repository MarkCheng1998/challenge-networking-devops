name: CD - Continuous Deployment (Staging + Canary)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      canary_percentage:
        description: "Canary traffic percentage (0-100)"
        required: false
        default: "10"
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Version & Tag ─────────────────────────────────────────────────
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            # Use short commit SHA for staging
            VERSION="0.0.0-dev.${GITHUB_SHA::7}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi
          echo "Version: $VERSION"

  # ─── Build & Push Docker Image ────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to Staging ────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [version, build-push]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.challenge-net.internal
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging with docker-compose
        run: |
          echo "Deploying version ${{ needs.version.outputs.version }} to staging..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          # In a real environment, this would SSH to the staging server:
          # ssh staging-host "cd /opt/challenge-networking && \\
          #   export IMAGE_TAG=main && \\
          #   docker-compose -f docker-compose.staging.yml up -d --no-deps"
          echo "Staging deployment simulated (configure your deployment target)"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # curl -sf https://staging.challenge-net.internal/health
          # curl -sf https://staging.challenge-net.internal/ready
          echo "Smoke tests passed"

      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployed to Staging: v${{ needs.version.outputs.version }}`,
              body: `Staging deployment completed.\n\nCommit: ${context.sha}\nVersion: ${{ needs.version.outputs.version }}\n\nCheck: https://staging.challenge-net.internal/health`,
              labels: ['deployment', 'staging']
            })

  # ─── Canary / Gray Release ───────────────────────────────────────
  canary:
    name: Canary Release
    runs-on: ubuntu-latest
    needs: [version, build-push]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure canary percentage
        id: canary
        run: |
          if [ -n "${{ inputs.canary_percentage }}" ]; then
            PCT=${{ inputs.canary_percentage }}
          else
            PCT=10
          fi
          echo "canary_pct=$PCT" >> $GITHUB_OUTPUT
          echo "Canary traffic percentage: $PCT%"

      - name: Deploy canary instance
        run: |
          echo "Deploying canary instance with ${{ steps.canary.outputs.canary_pct }}% traffic..."
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}"
          # In a real environment:
          # - Deploy 1 canary container alongside existing production containers
          # - Configure load balancer to route N% traffic to canary
          # - Monitor error rate, latency, health checks
          echo "Canary deployment initiated"

      - name: Health check canary (30s soak)
        run: |
          echo "Soaking canary for 30 seconds..."
          sleep 30
          # curl -sf http://canary:5000/health
          # Check error rate < threshold
          echo "Canary health check passed"

      - name: Promote canary to production
        run: |
          echo "Promoting canary to full production..."
          echo "Updating all production containers to version ${{ needs.version.outputs.version }}"
          # In a real environment:
          # - Rolling update all containers to new image
          # - Wait for all to be healthy
          # - Remove old containers
          echo "Production promotion complete"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            ### Changes
            - Version: ${{ needs.version.outputs.version }}
            - Commit: ${{ github.sha }}

            ### Canary Deployment
            - Initial canary: ${{ steps.canary.outputs.canary_pct }}% traffic
            - Soak period: 30 seconds
            - Health check: passed
            - Promotion: full production rollout

            ### Artifacts
            - Docker image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}`
          draft: false
          prerelease: false

  # ─── Rollback (manual trigger) ────────────────────────────────────
  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
    steps:
      - name: Rollback instructions
        run: |
          echo "To rollback to a previous version:"
          echo "1. Find the previous stable tag: git tag --sort=-creatordate | head -5"
          echo "2. Re-deploy the previous image tag"
          echo "3. Update feature_flags: canary_release=false, canary_percentage=0"
          echo "4. Restart all containers with the previous image"
